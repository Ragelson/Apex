<head>

    <style>
        :root {
            --primary: #4a6bff;
            --secondary: #f8f9ff;
            --accent: #ff6b6b;
            --text: #333;
            --gray: #666;
            --light-gray: #f5f5f5;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--light-gray);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 2rem;
        }

        .success-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
        }

        .success-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .success-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .success-card h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .success-card p {
            font-size: 1.1rem;
            color: var(--gray);
            margin-bottom: 2rem;
        }

        .order-details {
            background: var(--secondary);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin: 2rem 0;
            text-align: left;
        }

        .order-details h3 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #3a5bff;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 768px) {
            .success-card {
                padding: 2rem;
                margin: 1rem;
            }

            .success-card h1 {
                font-size: 2rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <section class="success-section">
            <div class="success-card">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h1>Оплата успешна!</h1>
                <p>Спасибо за оплату подписки на наш планер.<br> Ваш аккаунт был успешно обновлен.</p> <!--
                <div class="order-details">
                    <h3>Детали заказа</h3>
                    <div class="detail-row">
                        <span>Продукт:</span>
                        <span>Премиум планировщик</span>
                    </div>
                    <div class="detail-row">
                        <span>Сумма:</span>
                        <span>990 ₽</span>
                    </div>
                    <div class="detail-row">
                        <span>Дата:</span>
                        <span id="current-date"></span>
                    </div>
                    <div class="detail-row">
                        <span>Статус:</span>
                        <span style="color: #4CAF50;">Оплачено</span>
                    </div>
                </div>
                  -->
                <div class="btn-group">
                    <a href="index.html" class="btn btn-primary">Начать использовать</a>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Установка текущей даты
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('ru-RU');

        // Эффект появления
        document.addEventListener('DOMContentLoaded', function () {
            const card = document.querySelector('.success-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';

            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>

</html>
